[package]
name = "kairos-wasm"
version = "0.1.0"
edition = "2024"
description = "Kairos rules core and engine for the browser (wasm32-wasip1)"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
kairos = { path = "../.." }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# A workspace of its own, apart from the engine crate.
[workspace]

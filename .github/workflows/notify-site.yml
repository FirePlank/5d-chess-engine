# Tell 5D Chess Lab (FirePlank/5d-chess-lab), which builds this engine for the browser, that
# the engine changed: moving its `engine-sync` tag starts its Pages workflow, which moves its
# engine pin to this commit, checks the browser build and deploys. The SITE_DEPLOY_KEY secret
# is the private half of a deploy key (write access) on 5d-chess-lab only; a push with it, unlike
# one with this repository's GITHUB_TOKEN, starts workflows there. Without the secret the site
# still picks the change up when its own schedule runs.
name: Notify 5D Chess Lab

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch: {}

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Move 5d-chess-lab's engine-sync tag
        env:
          KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "No SITE_DEPLOY_KEY secret: the site picks this commit up when its schedule runs."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/site_key && chmod 600 ~/.ssh/site_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:FirePlank/5d-chess-lab.git site
          cd site
          # Deleted and created again: moving a tag to the commit it is already on starts nothing.
          git push origin :refs/tags/engine-sync 2>/dev/null || true
          git tag -f engine-sync
          git push origin engine-sync
          echo "Notified 5D Chess Lab of $GITHUB_SHA"

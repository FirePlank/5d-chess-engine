# The site moved to its own repository, 5D Chess Lab (FirePlank/5d-chess-lab). This repository's
# Pages now only forward old links there, keeping the page's #/route (analysis, play, ...).
name: Pages (redirect to 5D Chess Lab)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>5D Chess Lab</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://fireplank.github.io/5d-chess-lab/">
          <meta http-equiv="refresh" content="0; url=https://fireplank.github.io/5d-chess-lab/">
          <script>location.replace('https://fireplank.github.io/5d-chess-lab/' + location.hash);</script>
          <p>The Kairos site is now <a href="https://fireplank.github.io/5d-chess-lab/">5D Chess Lab</a>.</p>
          HTML
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
